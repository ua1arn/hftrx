<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>lwIP Live Uncompressed OggFLAC Stream</title>
</head>
<body>
  <h2>Live Uncompressed OggFLAC Audio Stream</h2>
  <audio id="player" controls autoplay>
    <source src="http://192.168.16.86/stream" type="audio/ogg">
    Your browser does not support HTML5 audio.
  </audio>

  <script>
    const player = document.getElementById('player');

    /* Automatically reconnect if network drops */
    player.addEventListener('error', () => {
      setTimeout(() => {
        player.src = 'http://192.168.16.86/stream?t=' + Date.now();
        player.play().catch(() => {});
      }, 1000);
    });
  </script>
</body>
</html>
